name: SelfMatrix product checks

on:
  push:
    branches: [product/discord-style-shell]
  pull_request:
    branches: [product/discord-style-shell]

permissions:
  contents: read

concurrency:
  group: selfmatrix-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      # pnpm lint は tsc + eslint + knip のみで、upstream の lint.yaml が個別に走らせる
      # prettier / i18n を含まない。i18n はここで補完する (全体レビュー 2026-07-12 の指摘対応)。
      # prettier:check は意図的に入れない: この fork は v0.20.1 ベース固定で、formatter の
      # バージョン乖離により `prettier -c .` が 400+ ファイルで fail する。通すには全面
      # リフォーマットが必要で upstream merge を汚染するため、fork 差分最小方針を優先する。
      - name: Lint
        run: pnpm lint

      - name: i18n consistency
        run: pnpm i18n:check

      - name: Unit tests
        run: pnpm test:unit -- --run

      - name: Build embedded bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:embedded

      - name: Audit production dependencies
        run: pnpm audit --prod
